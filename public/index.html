<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เกม OX ออนไลน์</title>
<style>
  body {
    margin: 0; min-height: 100vh; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #6d5efc, #23d5ab);
    display: flex; align-items: center; justify-content: center; color: #1f2937; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 34px 28px; max-width: 420px; width: 100%;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  h1 { font-size: 2.4rem; margin: 0 0 6px; letter-spacing: 2px; }
  .o { color: #2563eb; font-weight: 900; } .x { color: #ef4444; font-weight: 900; }
  p { color: #6b7280; margin: 0 0 24px; }
  a.btn {
    display: block; text-decoration: none; color: #fff; padding: 16px; border-radius: 14px;
    font-weight: 800; font-size: 1.15rem; margin-top: 14px; transition: transform .08s;
  }
  a.btn:active { transform: translateY(2px); }
  .student { background: linear-gradient(135deg, #7c3aed, #ec4899); }
  .teacher { background: linear-gradient(135deg, #0ea5e9, #14b8a6); }
  .hint { font-size: .85rem; color: #9ca3af; margin-top: 22px; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="o">O</span><span class="x">X</span> ออนไลน์</h1>
  <p>เกมแข่งขัน OX สำหรับห้องเรียน</p>
  <a class="btn student" href="/student.html">👦 ฉันเป็นนักเรียน (เข้าแข่งขัน)</a>
  <a class="btn teacher" href="/teacher.html">👨‍🏫 ฉันเป็นครู (จัดการแข่งขัน)</a>
  <div class="hint">นักเรียน: กดปุ่มสีม่วง แล้วใส่ชื่อเล่นเพื่อเข้าร่วม</div>
</div>
</body>
</html>
